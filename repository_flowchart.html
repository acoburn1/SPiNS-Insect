<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPiNS-Insect Visual Repository + Pipeline Map</title>
  <style>
    :root {
      --bg: #f8fafc;
      --text: #0f172a;
      --muted: #334155;
      --line: #475569;
      --main: #dbeafe;
      --prep: #dcfce7;
      --train: #ede9fe;
      --eval: #fef3c7;
      --out: #fee2e2;
      --side: #e2e8f0;
      --meta: #cffafe;
    }
    body { font-family: Inter, Segoe UI, Arial, sans-serif; margin: 16px; background: var(--bg); color: var(--text); }
    h1 { margin: 0 0 8px; font-size: 1.25rem; }
    p { margin: 0 0 14px; color: var(--muted); }
    svg { width: 100%; max-width: 2000px; border: 1px solid #cbd5e1; border-radius: 10px; background: white; }
    .box { stroke: var(--line); stroke-width: 1.4; rx: 12; ry: 12; }
    .main { fill: var(--main); }
    .prep { fill: var(--prep); }
    .train { fill: var(--train); }
    .eval { fill: var(--eval); }
    .out { fill: var(--out); }
    .side { fill: var(--side); }
    .meta { fill: var(--meta); }
    .t { font-size: 15px; font-weight: 700; fill: #0b1220; }
    .s { font-size: 12px; fill: #1e293b; }
    .arrow { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .soft { stroke-dasharray: 4 4; }
  </style>
</head>
<body>
  <h1>SPiNS-Insect: Centralized Left-to-Right Flowchart (Structure + Runtime)</h1>
  <p>Everything is contained in one visual: key folders/files, model/data/probe setup, training/evaluation/output flow, and less-critical offshoot utilities.</p>

  <svg viewBox="0 0 1960 980" role="img" aria-label="SPiNS-Insect full repository and program flow">
    <defs>
      <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0,0 10,4 0,8" fill="#334155"></polygon>
      </marker>
    </defs>

    <rect class="box main" x="30" y="320" width="230" height="170"/>
    <text class="t" x="45" y="348">1) Entry / CLI</text>
    <text class="s" x="45" y="370">lab_tests/program.py</text>
    <text class="s" x="45" y="388">--train --evaluate --graph</text>
    <text class="s" x="45" y="406">--all --tabular --visual</text>
    <text class="s" x="45" y="424">calls RunConfig(...)</text>

    <rect class="box prep" x="320" y="290" width="320" height="230"/>
    <text class="t" x="335" y="320">2) Config Resolution + Setup</text>
    <text class="s" x="335" y="342">DriverUtils/Parser.py + configs/utils.py</text>
    <text class="s" x="335" y="360">Loads YAML from configs/{data,model,</text>
    <text class="s" x="335" y="378">output,probe,directory}/*.yaml</text>
    <text class="s" x="335" y="396">RunConfig initializes:</text>
    <text class="s" x="350" y="414">• hidden_layer_range + learning_rate_range</text>
    <text class="s" x="350" y="432">• num_models, epochs, optimizer mode</text>
    <text class="s" x="350" y="450">• result dirs + dependency registry</text>
    <text class="s" x="350" y="468">• saves result_dir/config.json snapshot</text>

    <rect class="box prep" x="700" y="220" width="350" height="370"/>
    <text class="t" x="715" y="250">3) Model/Data/Probe Preparation</text>
    <text class="s" x="715" y="272">Training data prep (DataHelper/utils.py):</text>
    <text class="s" x="730" y="290">• csv_training_data_to_numpy(...)</text>
    <text class="s" x="730" y="308">• get_dataloader(...) or SpecialDataLoader</text>
    <text class="s" x="715" y="332">Probe prep (DataHelper/Probe.py):</text>
    <text class="s" x="730" y="350">• rebuilds probe parquet from sources</text>
    <text class="s" x="730" y="368">• supports exemplar / ratio / missing_feature / onehot</text>
    <text class="s" x="730" y="386">• outputs probe tensor + metadata + index json</text>
    <text class="s" x="715" y="410">Reference matrix prep:</text>
    <text class="s" x="730" y="428">• DriverUtils/RMutils.py gets modular/lattice RMs</text>
    <text class="s" x="715" y="452">Model setup (Model/):</text>
    <text class="s" x="730" y="470">• NeuralNetwork.py: Linear(2F→H), ReLU, Linear(H→2F)</text>
    <text class="s" x="730" y="488">• StandardModel.py picks Adam or SGD</text>
    <text class="s" x="730" y="506">• initializes probe pass at epoch 0</text>
    <text class="s" x="730" y="524">  (hidden + sigmoid(output) + initial loss slot)</text>

    <rect class="box train" x="1110" y="300" width="300" height="210"/>
    <text class="t" x="1125" y="330">4) Training Loop</text>
    <text class="s" x="1125" y="352">For each (HLS, LR):</text>
    <text class="s" x="1140" y="370">for i in range(num_models):</text>
    <text class="s" x="1155" y="388">for epoch in range(num_epochs):</text>
    <text class="s" x="1170" y="406">forward → loss → backward → step</text>
    <text class="s" x="1170" y="424">then probe hidden/output capture</text>
    <text class="s" x="1125" y="446">records per-model arrays:</text>
    <text class="s" x="1140" y="464">losses[E], hidden[E,P,H], output[E,P,O]</text>

    <rect class="box train" x="1470" y="300" width="260" height="210"/>
    <text class="t" x="1485" y="330">5) Activation Storage</text>
    <text class="s" x="1485" y="352">DriverUtils/Zarr.py</text>
    <text class="s" x="1485" y="370">build_zarr_from_results(...)</text>
    <text class="s" x="1485" y="388">writes datasets:</text>
    <text class="s" x="1500" y="406">loss[M,E]</text>
    <text class="s" x="1500" y="424">hidden[M,E,P,H]</text>
    <text class="s" x="1500" y="442">output[M,E,P,O]</text>
    <text class="s" x="1485" y="464">ActivationData/.../activations.zarr</text>

    <rect class="box eval" x="1110" y="580" width="360" height="250"/>
    <text class="t" x="1125" y="610">6) Evaluation (Eval/*)</text>
    <text class="s" x="1125" y="632">dependency-driven evaluator selection from</text>
    <text class="s" x="1125" y="650">Output/schema/dependencies.py</text>
    <text class="s" x="1125" y="674">Core evaluators:</text>
    <text class="s" x="1140" y="692">• Correlation / MatrixCorrelation / WithinVsBetweenCorrelation</text>
    <text class="s" x="1140" y="710">• K95 (PCA) / RatioTest / MFA / Loss</text>
    <text class="s" x="1125" y="734">Statistics/StatHelper.py computes</text>
    <text class="s" x="1140" y="752">mean/std/se/CI over models</text>
    <text class="s" x="1125" y="776">Saved per evaluator: AnalysisData/*.npz</text>
    <text class="s" x="1140" y="794">raw + summary stats + optional metadata</text>

    <rect class="box eval" x="1510" y="580" width="220" height="250"/>
    <text class="t" x="1525" y="610">6a) Sig Epoch</text>
    <text class="s" x="1525" y="632">Eval/SigE.py</text>
    <text class="s" x="1525" y="650">if config asks for "sig" or</text>
    <text class="s" x="1525" y="668">"wb-sig": compute epoch masks</text>
    <text class="s" x="1525" y="690">write:</text>
    <text class="s" x="1540" y="708">sige.npz</text>
    <text class="s" x="1540" y="726">wb-sige.npz</text>

    <rect class="box out" x="1760" y="300" width="170" height="530"/>
    <text class="t" x="1772" y="330">7) Output</text>
    <text class="s" x="1772" y="352">Output/*.py modules</text>
    <text class="s" x="1772" y="370">build OutputSpec(s)</text>
    <text class="s" x="1772" y="394">Plot renderer:</text>
    <text class="s" x="1772" y="412">Output/schema/</text>
    <text class="s" x="1772" y="430">PlotOutput.py</text>
    <text class="s" x="1772" y="454">Writes figures into:</text>
    <text class="s" x="1772" y="472">Output/&lt;training&gt;_hls*_lr*</text>
    <text class="s" x="1772" y="496">then organizes grouped</text>
    <text class="s" x="1772" y="514">graphs by name</text>
    <text class="s" x="1772" y="538">(DriverUtils/Organize.py)</text>
    <text class="s" x="1772" y="564">Optional tabular branch:</text>
    <text class="s" x="1772" y="582">DriverUtils/</text>
    <text class="s" x="1772" y="600">TabularExport.py</text>

    <rect class="box side" x="320" y="70" width="320" height="170"/>
    <text class="t" x="335" y="100">Repository Areas (structural map)</text>
    <text class="s" x="335" y="122">lab_tests/DriverUtils: orchestration + persistence + metadata</text>
    <text class="s" x="335" y="140">lab_tests/Model: NN definition + train wrapper</text>
    <text class="s" x="335" y="158">lab_tests/DataHelper: CSV/parquet/probe/data loaders</text>
    <text class="s" x="335" y="176">lab_tests/Eval: analysis transforms on activation tensors</text>
    <text class="s" x="335" y="194">lab_tests/Output: chart specs + rendering</text>
    <text class="s" x="335" y="212">lab_tests/Statistics: aggregation helpers</text>

    <rect class="box meta" x="1470" y="70" width="460" height="170"/>
    <text class="t" x="1485" y="100">Cross-cutting metadata + reproducibility offshoot</text>
    <text class="s" x="1485" y="122">DriverUtils/RunMetadata.py writes stage metadata with:</text>
    <text class="s" x="1500" y="140">• started/finished UTC timestamps, status</text>
    <text class="s" x="1500" y="158">• git branch/commit, config path, stage details</text>
    <text class="s" x="1485" y="182">Generated for activation_data, analysis_data, output stages</text>
    <text class="s" x="1485" y="204">Supports reproducibility/debugging without changing core flow</text>

    <path class="arrow" d="M640 405 L700 405"/>
    <path class="arrow" d="M1050 405 L1110 405"/>

    <path class="arrow soft" d="M640 150 L800 220"/>

  </svg>
</body>
